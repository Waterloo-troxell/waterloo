name: Deploy

# Paths that cannot change the built site do not get a deploy. A production
# deploy costs 15 of 300 monthly Netlify credits, so spending one on a CI
# config bump or a typo in a README is real money for nothing.
# NOTE: the two lists below are duplicated on purpose. GitHub Actions does
# not support YAML anchors in workflow files, so keep them in step by hand.
on:
  pull_request:
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/*.md"
      - ".env.example"
      - ".gitignore"
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/*.md"
      - ".env.example"
      - ".gitignore"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: ${{ github.event_name == 'push' && 'Production' || 'Preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Nothing reaches production unless the checks passed.
    steps:
      # Until the Netlify token exists, this job reports green and explains
      # itself rather than failing. A red check nobody can act on trains
      # people to ignore red checks.
      - name: Are the Netlify credentials set yet?
        id: creds
        env:
          TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$SITE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID are not set yet, so there is nothing to deploy to. This is expected until Phase B of M0 is done."
          fi

      - uses: actions/checkout@v5
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.creds.outputs.ready == 'true'

      - name: Stamp the build
        if: steps.creds.outputs.ready == 'true'
        run: |
          {
            echo "NEXT_PUBLIC_BUILD_SHA=${GITHUB_SHA}"
            echo "NEXT_PUBLIC_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "NEXT_PUBLIC_DEPLOY_CONTEXT=${{ github.event_name == 'push' && 'production' || 'preview' }}"
          } >> "$GITHUB_ENV"

      # Previews talk to the separate preview database (Kaden's free
      # project), so a pull request's database changes never touch real data
      # before the other owner approves them. Production talks to the real one.
      # Both values are browser-safe; row-level security guards the data.
      - name: Point the build at its database
        if: steps.creds.outputs.ready == 'true'
        env:
          URL: ${{ github.event_name == 'push' && secrets.SUPABASE_URL || secrets.PREVIEW_SUPABASE_URL }}
          KEY: ${{ github.event_name == 'push' && secrets.SUPABASE_ANON_KEY || secrets.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning title=No database for this deploy::The Supabase URL or key secret for this deploy is not set, so the site will say no database is connected."
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${KEY}"
          } >> "$GITHUB_ENV"

      # Database changes go in before the site that needs them. If a migration
      # fails, the job stops here and the old site stays up.
      - name: Apply database migrations
        if: steps.creds.outputs.ready == 'true'
        env:
          DB_URL: ${{ github.event_name == 'push' && secrets.PRODUCTION_DATABASE_URL || secrets.PREVIEW_DATABASE_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::warning title=Migrations not applied::No database connection string is set for this deploy, so its migrations were not applied."
            exit 0
          fi
          npx supabase db push --remote="$DB_URL" --yes --skip-vault

      # The one-time owner bootstrap (G1). It runs only when a reviewed file
      # for this database exists and no owners are set yet; the database
      # itself refuses a second run.
      - name: Owner bootstrap, if this database has none yet
        if: steps.creds.outputs.ready == 'true'
        env:
          DB_URL: ${{ github.event_name == 'push' && secrets.PRODUCTION_DATABASE_URL || secrets.PREVIEW_DATABASE_URL }}
          FILE: supabase/bootstrap/${{ github.event_name == 'push' && 'production' || 'preview' }}.sql
        run: |
          if [ -z "$DB_URL" ] || [ ! -f "$FILE" ]; then
            echo "No bootstrap to run."
            exit 0
          fi
          owners=$(psql "$DB_URL" -Atc "select count(*) from public.workspace_members where role = 'owner'")
          if [ "$owners" = "0" ]; then
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$FILE"
          else
            echo "Owners already set ($owners). Nothing to do."
          fi

      # Preview deploys cost no Netlify credits and are unlimited.
      - name: Deploy preview
        if: github.event_name == 'pull_request' && steps.creds.outputs.ready == 'true'
        id: preview
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx netlify-cli deploy --build \
            --alias "pr-${{ github.event.number }}" \
            --json > deploy.json
          echo "url=$(node -p "require('./deploy.json').deploy_url")" >> "$GITHUB_OUTPUT"

      - name: Put the preview link on the pull request
        if: github.event_name == 'pull_request' && steps.creds.outputs.ready == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            **Preview deploy:** ${{ steps.preview.outputs.url }}

            Test here before approving. Preview deploys are free and unlimited;
            only merging to `main` spends Netlify credits.

      # Production costs 15 of 300 monthly credits. Roughly one per milestone.
      - name: Deploy production
        if: github.event_name == 'push' && steps.creds.outputs.ready == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify-cli deploy --build --prod
