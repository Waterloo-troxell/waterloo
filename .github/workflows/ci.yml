name: CI

on:
  pull_request:
  push:
    branches: [main]

# Never let two runs of the same branch pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, tests, secrets, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The secret scan reads every tracked file; it does not need history.
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Scan for secrets
        run: npm run check:secrets

      # This job has no database, so the tests that need one are skipped
      # here and run for real in the "Row-level security" job below. That
      # job is a required check, so a skipped test can never reach main.
      - name: Tests
        run: npm test
        env:
          WATERLOO_SKIP_DB: "1"

      - name: Build
        run: npm run build

  database:
    name: Row-level security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Start the local Supabase stack
        run: npx supabase start

      # Prove the guard still catches an unprotected table. A check that
      # cannot fail is not a check, so this runs before the real one.
      - name: Prove the guard fires
        run: npm run check:rls:selftest

      - name: Every table must have row-level security
        run: npm run check:rls

      # G1, G2, G4 and the sign-in rules, against real Postgres and real
      # Supabase Auth. (The job keeps its old name because branch protection
      # requires it by that name.)
      - name: Governance and sign-in tests against the real database
        run: npx vitest run tests/governance tests/auth

      - name: Stop the stack
        if: always()
        run: npx supabase stop --no-backup || true
