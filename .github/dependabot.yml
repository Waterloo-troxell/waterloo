# Dependency updates, reviewed weekly (brief §9). Grouped so the two owners
# see a handful of pull requests a week, not thirty.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # typescript-eslint, which ships inside eslint-config-next, does not
      # support TypeScript 7 — a major bump breaks `npm run lint` outright.
      # Verified by CI on dependabot PR #5: "typescript-eslint does not
      # support TS 7.0." Tracking upstream:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      # Remove this once typescript-eslint supports TS >= 7.1.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
